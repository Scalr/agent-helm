name: Lint and Test Charts

on: pull_request

permissions:
  contents: read

concurrency:
  group: chart-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-test:
    if: github.repository == 'Scalr/agent-helm'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CT_TARGET_BRANCH: ${{ github.base_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2  # v5.0.0
        with:
          version: v4.3.0

      - name: Set up helm-unittest
        run: |
          curl --fail --location --retry 3 \
            https://github.com/helm-unittest/helm-unittest/releases/download/v1.2.1/unittest-1.2.1.tgz \
            --output "$RUNNER_TEMP/unittest.tgz"
          echo "bbcebd42631dff9fc595462fad839c49a1b06f9635e952e7e837d7e5fe82865f  $RUNNER_TEMP/unittest.tgz" | sha256sum --check
          helm plugin install "$RUNNER_TEMP/unittest.tgz" --verify=false

      - name: Run unit tests
        run: helm unittest --strict charts/*

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f  # v2.8.0
        with:
          version: v3.15.0

      - name: Lint charts
        run: ct lint --config .ct/ct.yaml --all

      - name: Select charts for installation
        id: changes
        run: |
          changed=$(ct list-changed --config .ct/ct.yaml)
          if git diff --name-only "origin/$CT_TARGET_BRANCH...HEAD" -- \
            .ct/ct.yaml .ct/kind.yaml .github/workflows/lint-test-chart.yaml | grep -q .; then
            echo "CT_ALL=true" >> "$GITHUB_ENV"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create kind cluster
        if: steps.changes.outputs.changed == 'true'
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa  # v1.15.1
        with:
          version: v0.33.0
          config: .ct/kind.yaml
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          kubectl_version: v1.37.1

      - name: Install and upgrade charts
        if: steps.changes.outputs.changed == 'true'
        run: ct install --config .ct/ct.yaml --upgrade
