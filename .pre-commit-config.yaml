# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: local
    hooks:
      - id: build-js-actions
        name: Build JS GitHub Actions
        entry: bash -c 'find ".github/actions" -mindepth 2 -maxdepth 2 -type f -name "package.json" -exec dirname {} \; | xargs -I {} npm --prefix {} run all'
        language: system
        pass_filenames: false
        files: ^\.github/actions/
      - id: chart-lint
        name: Lint Helm charts
        entry: ct lint --config .ct/ct.yaml --all
        language: python
        additional_dependencies:
          - yamale==6.0.0
          - yamllint==1.33.0
        pass_filenames: false
        files: ^(charts/|\.ct/|justfile$|\.pre-commit-config\.yaml$)
      - id: helm-unittest
        name: Run Helm unit tests
        entry: just test
        language: system
        pass_filenames: false
        files: ^(charts/|justfile$|\.pre-commit-config\.yaml$)
      - id: ruff-check
        name: Lint Python scripts
        entry: uv run --locked ruff check --fix
        language: system
        pass_filenames: false
        files: &python_files ^(scripts/.*\.py$|pyproject\.toml$|uv\.lock$|\.python-version$|\.pre-commit-config\.yaml$)
      - id: ruff-format
        name: Format Python scripts
        entry: uv run --locked ruff format
        language: system
        pass_filenames: false
        files: *python_files
      - id: ty
        name: Type-check Python scripts
        entry: uv run --locked ty check
        language: system
        pass_filenames: false
        files: *python_files
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: &compiled_js '.*\/index\.dist\.js$'
      - id: end-of-file-fixer
        exclude: *compiled_js
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: "^(charts/agent-k8s/templates|charts/agent-docker/templates|charts/agent-local/templates|charts/agent-job/templates)"
      - id: check-added-large-files
  - repo: https://github.com/lycheeverse/lychee.git
    rev: lychee-v0.24.2
    hooks:
      - id: lychee
        args:
          [
            "--no-progress",
            ".",
            "--offline",
            "--include-fragments",
            "--extensions",
            "md",
          ]
        pass_filenames: false
