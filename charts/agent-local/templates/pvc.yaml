{{- range $name := list "data" "cache" }}
{{- $volume := include "agent-local.persistence.volume" (dict "root" $ "name" $name) | fromYaml }}
{{- if and (eq $volume.mode "persistentVolumeClaim") (not $volume.claimName) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $volume.defaultClaimName }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "agent-local.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  {{- with $volume.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ $volume.accessMode }}
  resources:
    requests:
      storage: {{ $volume.storage }}
  {{- with $volume.storageClassName }}
  storageClassName: {{ ternary "" . (eq . "-") | quote }}
  {{- end }}
{{- end }}
{{- end }}
