{{- if or (.Values.persistence).enabled ((.Values.persistence).persistentVolumeClaim).claimName -}}
{{-   fail `persistence.enabled and persistence.persistentVolumeClaim were removed after deprecation in v0.6.1.
Move the old settings under persistence.cache and remove the old keys. For example:

persistence:
  cache:
    enabled: true
    persistentVolumeClaim:
      storage: 20Gi` -}}
{{- end -}}

{{- if and
  .Values.persistence.data.enabled
  (eq (.Values.persistence.data.mode | default "persistentVolumeClaim") "persistentVolumeClaim")
  (not .Values.persistence.data.persistentVolumeClaim.claimName)
}}
{{- if and (gt (.Values.replicaCount | int) 1) (eq .Values.persistence.data.persistentVolumeClaim.accessMode "ReadWriteOncePod") -}}
{{-   fail "A shared ReadWriteOncePod claim requires replicaCount <= 1. Use per-pod claims for multiple replicas." -}}
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "agent-local.fullname" . }}-data
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "agent-local.labels" . | nindent 4 }}
    app.kubernetes.io/component: data
  {{- with .Values.persistence.data.persistentVolumeClaim.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.data.persistentVolumeClaim.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.persistentVolumeClaim.storage }}
  {{- with .Values.persistence.data.persistentVolumeClaim.storageClassName }}
  storageClassName: {{ ternary "" . (eq . "-") | quote }}
  {{- end }}
{{- end }}

{{- if and
  .Values.persistence.cache.enabled
  (eq (.Values.persistence.cache.mode | default "persistentVolumeClaim") "persistentVolumeClaim")
  (not .Values.persistence.cache.persistentVolumeClaim.claimName)
}}
{{- if and (gt (.Values.replicaCount | int) 1) (eq .Values.persistence.cache.persistentVolumeClaim.accessMode "ReadWriteOncePod") -}}
{{-   fail "A shared ReadWriteOncePod claim requires replicaCount <= 1. Use per-pod claims for multiple replicas." -}}
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "agent-local.fullname" . }}-cache
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "agent-local.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
  {{- with .Values.persistence.cache.persistentVolumeClaim.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.cache.persistentVolumeClaim.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.cache.persistentVolumeClaim.storage }}
  {{- with .Values.persistence.cache.persistentVolumeClaim.storageClassName }}
  storageClassName: {{ ternary "" . (eq . "-") | quote }}
  {{- end }}
{{- end }}
