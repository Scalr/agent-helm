{{- if eq (.Values.workload).kind "StatefulSet" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-local.statefulSetName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "agent-local.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "agent-local.selectorLabels" . | nindent 4 }}
{{- end }}
