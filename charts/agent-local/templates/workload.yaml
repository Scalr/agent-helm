{{- $kind := include "agent-local.workloadKind" . -}}
{{- $data := include "agent-local.persistence.volume" (dict "root" . "name" "data") | fromYaml -}}
{{- $cache := include "agent-local.persistence.volume" (dict "root" . "name" "cache") | fromYaml -}}
{{- $clientCert := or .Values.agent.tls.clientCertSecret.name (and .Values.agent.tls.clientCert .Values.agent.tls.clientKey) -}}
{{- $caBundle := or .Values.agent.tls.caBundleSecret.name .Values.agent.tls.caBundle -}}
{{- $env := include "agent-local.env" (dict "root" . "clientCert" $clientCert "caBundle" $caBundle) | fromYaml -}}

apiVersion: apps/v1
kind: {{ $kind }}
metadata:
  name: {{ if eq $kind "StatefulSet" }}{{ include "agent-local.statefulSetName" . }}{{ else }}{{ include "agent-local.fullname" . }}{{ end }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "agent-local.labels" . | nindent 4 }}
  {{- /* TODO: Autoscalers read pod annotations, so these controller annotations do not protect pods.
  Move them to spec.template.metadata.annotations, allowing podAnnotations overrides.
  Document the change in eviction behavior for existing installations. */}}
  annotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    karpenter.sh/do-not-evict: "true"
    karpenter.sh/do-not-disrupt: "true"
    autopilot.gke.io/priority: high
spec:
  {{- if eq $kind "Deployment" }}
  strategy:
    type: {{ .Values.strategy.type }}
    {{- if eq .Values.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.strategy.rollingUpdate.maxUnavailable }}
    {{- end }}
  {{- else }}
  {{- $statefulSet := .Values.workload.statefulSet | default dict }}
  {{- $updateStrategy := dig "updateStrategy" "type" "RollingUpdate" $statefulSet }}
  serviceName: {{ include "agent-local.statefulSetName" . }}
  podManagementPolicy: {{ $statefulSet.podManagementPolicy | default "Parallel" }}
  updateStrategy:
    type: {{ $updateStrategy }}
    {{- if eq $updateStrategy "RollingUpdate" }}
    rollingUpdate:
      partition: {{ dig "updateStrategy" "rollingUpdate" "partition" 0 $statefulSet }}
    {{- end }}
  {{- if or (eq $data.mode "volumeClaimTemplate") (eq $cache.mode "volumeClaimTemplate") }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ dig "persistentVolumeClaimRetentionPolicy" "whenDeleted" "Retain" $statefulSet }}
    whenScaled: {{ dig "persistentVolumeClaimRetentionPolicy" "whenScaled" "Retain" $statefulSet }}
  volumeClaimTemplates:
    {{- range $volume := list $data $cache }}
    {{- if eq $volume.mode "volumeClaimTemplate" }}
    - metadata:
        name: {{ $volume.name }}-dir
        labels:
          {{- /* Claim template metadata is immutable: do not include chart/app versions. */}}
          {{- include "agent-local.selectorLabels" $ | nindent 10 }}
          app.kubernetes.io/component: {{ $volume.name }}
        {{- with omit $volume.annotations "helm.sh/resource-policy" }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        {{- include "agent-local.persistence.claimSpec" $volume | nindent 8 }}
    {{- end }}
    {{- end }}
  {{- end }}
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "agent-local.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- merge (include "agent-local.selectorLabels" . | fromYaml) (default (dict) .Values.podLabels) | toYaml | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "agent-local.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- range $key, $value := .Values.extraEnv }}
            {{- if hasKey $env $key }}
            {{- fail (printf "extraEnv contains a key '%s' that is controlled by the Helm chart" $key) }}
            {{- end }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $key, $value := $env }}
            - name: {{ $key }}
              {{- toYaml $value | nindent 14 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data-dir
              mountPath: {{ .Values.agent.dataDir }}
              {{- if and (ne $data.mode "emptyDir") $data.subPath }}
              subPath: {{ $data.subPath }}
              {{- end }}
            - name: cache-dir
              mountPath: {{ .Values.agent.cacheDir }}
              {{- if and (ne $cache.mode "emptyDir") $cache.subPath }}
              subPath: {{ $cache.subPath }}
              {{- end }}
            {{- if $clientCert }}
            - name: client-cert
              mountPath: /etc/scalr-agent/ssl
              readOnly: true
            {{- end }}
            {{- if $caBundle }}
            - name: ca-bundle
              mountPath: /etc/ssl/certs/scalr-ca-bundle.crt
              subPath: {{ .Values.agent.tls.caBundleSecret.key }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- if or (ne $data.mode "volumeClaimTemplate") (ne $cache.mode "volumeClaimTemplate") $clientCert $caBundle .Values.extraVolumes }}
      volumes:
        {{- range $volume := list $data $cache }}
        {{- if ne $volume.mode "volumeClaimTemplate" }}
        {{- include "agent-local.persistence.podVolume" $volume | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- if $clientCert }}
        - name: client-cert
          secret:
            secretName: {{ .Values.agent.tls.clientCertSecret.name | default (printf "%s-client-cert" (include "agent-local.fullname" .)) }}
            items:
              - key: {{ .Values.agent.tls.clientCertSecret.certKey }}
                path: tls.crt
              - key: {{ .Values.agent.tls.clientCertSecret.keyKey }}
                path: tls.key
        {{- end }}
        {{- if $caBundle }}
        - name: ca-bundle
          secret:
            secretName: {{ .Values.agent.tls.caBundleSecret.name | default (printf "%s-ca-bundle" (include "agent-local.fullname" .)) }}
            items:
              - key: {{ .Values.agent.tls.caBundleSecret.key }}
                path: {{ .Values.agent.tls.caBundleSecret.key }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
