{{- /* Older releases using --reuse-values need the Deployment default. */ -}}
{{- $kind := (default dict .Values.workload).kind | default "Deployment" -}}
{{- $data := include "agent-local.persistence.volume" (dict "root" . "name" "data") | fromYaml -}}
{{- $cache := include "agent-local.persistence.volume" (dict "root" . "name" "cache") | fromYaml -}}
{{- $hasClientCert := or .Values.agent.tls.clientCertSecret.name (and .Values.agent.tls.clientCert .Values.agent.tls.clientKey) -}}
{{- $hasCaBundle := or .Values.agent.tls.caBundleSecret.name .Values.agent.tls.caBundle -}}
{{- $hasPodVolumes := or
  (ne $data.mode "volumeClaimTemplate")
  (ne $cache.mode "volumeClaimTemplate")
  $hasClientCert $hasCaBundle .Values.extraVolumes
-}}

apiVersion: apps/v1
kind: {{ $kind }}
metadata:
  name: {{ if eq $kind "StatefulSet" }}{{ include "agent-local.statefulSetName" . }}{{ else }}{{ include "agent-local.fullname" . }}{{ end }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "agent-local.labels" . | nindent 4 }}
  {{- /* TODO: Autoscalers read pod annotations, so these controller annotations leave pods unprotected.
  Move them to spec.template.metadata.annotations, allowing podAnnotations overrides.
  Document the change in eviction behavior for existing installations. */}}
  annotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    karpenter.sh/do-not-evict: "true"
    karpenter.sh/do-not-disrupt: "true"
    autopilot.gke.io/priority: high
spec:
  {{- if eq $kind "Deployment" }}
  strategy:
    type: {{ .Values.strategy.type }}
    {{- if eq .Values.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.strategy.rollingUpdate.maxUnavailable }}
    {{- end }}
  {{- else }}
  {{- $statefulSet := .Values.workload.statefulSet | default dict }}
  {{- $updateStrategy := dig "updateStrategy" "type" "RollingUpdate" $statefulSet }}
  serviceName: {{ include "agent-local.statefulSetName" . }}
  podManagementPolicy: {{ $statefulSet.podManagementPolicy | default "Parallel" }}
  updateStrategy:
    type: {{ $updateStrategy }}
    {{- if eq $updateStrategy "RollingUpdate" }}
    rollingUpdate:
      partition: {{ dig "updateStrategy" "rollingUpdate" "partition" 0 $statefulSet }}
    {{- end }}
  {{- if or (eq $data.mode "volumeClaimTemplate") (eq $cache.mode "volumeClaimTemplate") }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ dig "persistentVolumeClaimRetentionPolicy" "whenDeleted" "Retain" $statefulSet }}
    whenScaled: {{ dig "persistentVolumeClaimRetentionPolicy" "whenScaled" "Retain" $statefulSet }}
  volumeClaimTemplates:
    {{- range $volume := list $data $cache }}
    {{- if eq $volume.mode "volumeClaimTemplate" }}
    - metadata:
        name: {{ $volume.name }}-dir
        labels:
          {{- /* Immutable claim template metadata uses stable labels across releases. */}}
          {{- include "agent-local.selectorLabels" $ | nindent 10 }}
          app.kubernetes.io/component: {{ $volume.name }}
        {{- with omit $volume.annotations "helm.sh/resource-policy" }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          - {{ $volume.accessMode }}
        resources:
          requests:
            storage: {{ $volume.storage }}
        {{- with $volume.storageClassName }}
        storageClassName: {{ ternary "" . (eq . "-") | quote }}
        {{- end }}
    {{- end }}
    {{- end }}
  {{- end }}
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "agent-local.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- merge (include "agent-local.selectorLabels" . | fromYaml) (default (dict) .Values.podLabels) | toYaml | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "agent-local.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- /* Keep release ordering and validate extraEnv against the entries rendered below. */}}
            {{- $env := list
              (dict "name" "SCALR_AGENT_NAME" "valueFrom" (dict "fieldRef" (dict "fieldPath" "metadata.name")))
              (dict "name" "SCALR_URL" "value" .Values.agent.url)
              (dict "name" "SCALR_AGENT_DRIVER" "value" "local")
              (dict "name" "SCALR_AGENT_CONCURRENCY" "value" "1")
              (dict "name" "SCALR_AGENT_DISCONNECT_ON_STOP" "value" "1")
            }}
            {{- if eq .Values.agent.shutdownMode "graceful" }}
            {{- if lt (.Values.terminationGracePeriodSeconds | int) 30 }}
            {{- fail "terminationGracePeriodSeconds must be at least 30 seconds when agent.shutdownMode=graceful" }}
            {{- end }}
            {{- $env = append $env (dict "name" "SCALR_AGENT_WORKER_ON_STOP_ACTION" "value" "grace-shutdown") }}
            {{- $env = append $env (dict "name" "SCALR_AGENT_WORKER_GRACE_SHUTDOWN_TIMEOUT" "value" (sub .Values.terminationGracePeriodSeconds 10)) }}
            {{- else if eq .Values.agent.shutdownMode "drain" }}
            {{- if lt (.Values.terminationGracePeriodSeconds | int) 120 }}
            {{- fail "terminationGracePeriodSeconds must be at least 120 seconds when agent.shutdownMode=drain" }}
            {{- end }}
            {{- $env = append $env (dict "name" "SCALR_AGENT_WORKER_ON_STOP_ACTION" "value" "drain") }}
            {{- $env = append $env (dict "name" "SCALR_AGENT_WORKER_DRAIN_TIMEOUT" "value" (sub .Values.terminationGracePeriodSeconds 70)) }}
            {{- $env = append $env (dict "name" "SCALR_AGENT_WORKER_GRACE_SHUTDOWN_TIMEOUT" "value" "60") }}
            {{- else }}
            {{- $env = append $env (dict "name" "SCALR_AGENT_WORKER_ON_STOP_ACTION" "value" "force-shutdown") }}
            {{- end }}
            {{- $env = append $env (dict "name" "SCALR_AGENT_DATA_DIR" "value" .Values.agent.dataDir) }}
            {{- $env = append $env (dict "name" "SCALR_AGENT_CACHE_DIR" "value" .Values.agent.cacheDir) }}
            {{- with .Values.agent.providerNetworkMirrors }}
            {{- $env = append $env (dict "name" "SCALR_AGENT_PROVIDER_NETWORK_MIRRORS" "value" (toJson .)) }}
            {{- end }}
            {{- $tokenSecret := dict "name" (printf "%s-token" (include "agent-local.fullname" .)) "key" "token" "optional" false }}
            {{- if .Values.agent.tokenExistingSecret.name }}
            {{- $_ := set $tokenSecret "name" (.Values.agent.tokenExistingSecret.name | toString) }}
            {{- $_ := set $tokenSecret "key" (.Values.agent.tokenExistingSecret.key | toString) }}
            {{- end }}
            {{- $env = append $env (dict "name" "SCALR_AGENT_TOKEN" "valueFrom" (dict "secretKeyRef" $tokenSecret)) }}
            {{- if $hasClientCert }}
            {{- $env = append $env (dict "name" "SCALR_AGENT_TLS_CERT_FILE" "value" "/etc/scalr-agent/ssl/tls.crt") }}
            {{- $env = append $env (dict "name" "SCALR_AGENT_TLS_KEY_FILE" "value" "/etc/scalr-agent/ssl/tls.key") }}
            {{- end }}
            {{- if $hasCaBundle }}
            {{- $env = append $env (dict "name" "SCALR_AGENT_CA_CERT" "value" "/etc/ssl/certs/scalr-ca-bundle.crt") }}
            {{- $env = append $env (dict "name" "SSL_CERT_FILE" "value" "/etc/ssl/certs/scalr-ca-bundle.crt") }}
            {{- end }}
            {{- range $key, $value := .Values.extraEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $env }}
            {{- if hasKey ($.Values.extraEnv | default dict) .name }}
            {{- fail (printf "extraEnv contains a key '%s' that is controlled by the Helm chart" .name) }}
            {{- end }}
            - name: {{ .name }}
              {{- if hasKey . "value" }}
              value: {{ .value | quote }}
              {{- else }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data-dir
              mountPath: {{ .Values.agent.dataDir }}
              {{- if and (ne $data.mode "emptyDir") $data.subPath }}
              subPath: {{ $data.subPath }}
              {{- end }}
            - name: cache-dir
              mountPath: {{ .Values.agent.cacheDir }}
              {{- if and (ne $cache.mode "emptyDir") $cache.subPath }}
              subPath: {{ $cache.subPath }}
              {{- end }}
            {{- if $hasClientCert }}
            - name: client-cert
              mountPath: /etc/scalr-agent/ssl
              readOnly: true
            {{- end }}
            {{- if $hasCaBundle }}
            - name: ca-bundle
              mountPath: /etc/ssl/certs/scalr-ca-bundle.crt
              subPath: {{ .Values.agent.tls.caBundleSecret.key }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- if $hasPodVolumes }}
      volumes:
        {{- range $volume := list $data $cache }}
        {{- if ne $volume.mode "volumeClaimTemplate" }}
        - name: {{ $volume.name }}-dir
          {{- if eq $volume.mode "emptyDir" }}
          {{- if $volume.emptyDirSizeLimit }}
          emptyDir:
            sizeLimit: {{ $volume.emptyDirSizeLimit }}
          {{- else }}
          emptyDir: {}
          {{- end }}
          {{- else if eq $volume.mode "persistentVolumeClaim" }}
          persistentVolumeClaim:
            claimName: {{ $volume.claimName | default $volume.defaultClaimName }}
          {{- else if eq $volume.mode "ephemeral" }}
          ephemeral:
            volumeClaimTemplate:
              {{- with omit $volume.annotations "helm.sh/resource-policy" }}
              metadata:
                annotations:
                  {{- toYaml . | nindent 18 }}
              {{- end }}
              spec:
                accessModes:
                  - {{ $volume.accessMode }}
                resources:
                  requests:
                    storage: {{ $volume.storage }}
                {{- with $volume.storageClassName }}
                storageClassName: {{ ternary "" . (eq . "-") | quote }}
                {{- end }}
          {{- end }}
        {{- end }}
        {{- end }}
        {{- if $hasClientCert }}
        - name: client-cert
          secret:
            secretName: {{ .Values.agent.tls.clientCertSecret.name | default (printf "%s-client-cert" (include "agent-local.fullname" .)) }}
            items:
              - key: {{ .Values.agent.tls.clientCertSecret.certKey }}
                path: tls.crt
              - key: {{ .Values.agent.tls.clientCertSecret.keyKey }}
                path: tls.key
        {{- end }}
        {{- if $hasCaBundle }}
        - name: ca-bundle
          secret:
            secretName: {{ .Values.agent.tls.caBundleSecret.name | default (printf "%s-ca-bundle" (include "agent-local.fullname" .)) }}
            items:
              - key: {{ .Values.agent.tls.caBundleSecret.key }}
                path: {{ .Values.agent.tls.caBundleSecret.key }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
