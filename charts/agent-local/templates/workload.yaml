{{- $kind := include "agent-local.workloadKind" . -}}
{{- $data := include "agent-local.persistence.volume" (dict "root" . "name" "data") | fromYaml -}}
{{- $cache := include "agent-local.persistence.volume" (dict "root" . "name" "cache") | fromYaml -}}
{{- $clientCert := or .Values.agent.tls.clientCertSecret.name (and .Values.agent.tls.clientCert .Values.agent.tls.clientKey) -}}
{{- $caBundle := or .Values.agent.tls.caBundleSecret.name .Values.agent.tls.caBundle -}}
{{- /* Environment variables managed by the chart. */ -}}
{{- $reservedEnvVars := list
  "SCALR_AGENT_NAME"
  "SCALR_URL"
  "SCALR_AGENT_DRIVER"
  "SCALR_AGENT_CONCURRENCY"
  "SCALR_AGENT_DISCONNECT_ON_STOP"
  "SCALR_AGENT_WORKER_ON_STOP_ACTION"
  "SCALR_AGENT_WORKER_GRACE_SHUTDOWN_TIMEOUT"
  "SCALR_AGENT_WORKER_DRAIN_TIMEOUT"
  "SCALR_AGENT_DATA_DIR"
  "SCALR_AGENT_CACHE_DIR"
  "SCALR_AGENT_PROVIDER_NETWORK_MIRRORS"
  "SCALR_AGENT_TOKEN"
  "SCALR_AGENT_CA_CERT"
  "SCALR_AGENT_TLS_CERT_FILE"
  "SCALR_AGENT_TLS_KEY_FILE"
  "SSL_CERT_FILE"
-}}

apiVersion: apps/v1
kind: {{ $kind }}
metadata:
  name: {{ if eq $kind "StatefulSet" }}{{ include "agent-local.statefulSetName" . }}{{ else }}{{ include "agent-local.fullname" . }}{{ end }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "agent-local.labels" . | nindent 4 }}
spec:
  {{- if eq $kind "Deployment" }}
  strategy:
    type: {{ .Values.strategy.type }}
    {{- if eq .Values.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.strategy.rollingUpdate.maxUnavailable }}
    {{- end }}
  {{- else }}
  {{- $statefulSet := .Values.workload.statefulSet | default dict }}
  {{- $updateStrategy := dig "updateStrategy" "type" "RollingUpdate" $statefulSet }}
  serviceName: {{ include "agent-local.statefulSetName" . }}
  podManagementPolicy: {{ $statefulSet.podManagementPolicy | default "Parallel" }}
  updateStrategy:
    type: {{ $updateStrategy }}
    {{- if eq $updateStrategy "RollingUpdate" }}
    rollingUpdate:
      partition: {{ dig "updateStrategy" "rollingUpdate" "partition" 0 $statefulSet }}
    {{- end }}
  {{- if or (eq $data.mode "volumeClaimTemplate") (eq $cache.mode "volumeClaimTemplate") }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ dig "persistentVolumeClaimRetentionPolicy" "whenDeleted" "Retain" $statefulSet }}
    whenScaled: {{ dig "persistentVolumeClaimRetentionPolicy" "whenScaled" "Retain" $statefulSet }}
  volumeClaimTemplates:
    {{- range $volume := list $data $cache }}
    {{- if eq $volume.mode "volumeClaimTemplate" }}
    - metadata:
        name: {{ $volume.name }}-dir
        labels:
          {{- /* Claim template metadata is immutable: do not include chart/app versions. */}}
          {{- include "agent-local.selectorLabels" $ | nindent 10 }}
          app.kubernetes.io/component: {{ $volume.name }}
        {{- with omit $volume.annotations "helm.sh/resource-policy" }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        {{- include "agent-local.persistence.claimSpec" $volume | nindent 8 }}
    {{- end }}
    {{- end }}
  {{- end }}
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "agent-local.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- $annotations := dict
          "cluster-autoscaler.kubernetes.io/safe-to-evict" "false"
          "karpenter.sh/do-not-evict" "true"
          "karpenter.sh/do-not-disrupt" "true"
          "autopilot.gke.io/priority" "high"
        }}
        {{- mergeOverwrite $annotations (default dict .Values.podAnnotations) | toYaml | nindent 8 }}
      labels:
        {{- merge (include "agent-local.selectorLabels" . | fromYaml) (default (dict) .Values.podLabels) | toYaml | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "agent-local.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- if .Values.extraEnv }}
            {{- range $key, $value := .Values.extraEnv }}
            {{- if has $key $reservedEnvVars }}
            {{- fail (printf "extraEnv contains a key '%s' that is controlled by the Helm chart.\n\nReserved keys are:\n  - %s" $key (join "\n  - " $reservedEnvVars)) }}
            {{- end }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            - name: SCALR_AGENT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SCALR_URL
              value: {{ .Values.agent.url | quote }}
            - name: SCALR_AGENT_DRIVER
              value: local
            - name: SCALR_AGENT_CONCURRENCY
              value: "1"
            - name: SCALR_AGENT_DISCONNECT_ON_STOP
              value: "1"
            {{- if eq .Values.agent.shutdownMode "graceful" }}
              {{- if lt (.Values.terminationGracePeriodSeconds | int) 30 }}
              {{- fail "terminationGracePeriodSeconds must be at least 30 seconds when agent.shutdownMode=graceful" }}
              {{- end }}
            - name: SCALR_AGENT_WORKER_ON_STOP_ACTION
              value: grace-shutdown
            - name: SCALR_AGENT_WORKER_GRACE_SHUTDOWN_TIMEOUT
              value: {{ sub .Values.terminationGracePeriodSeconds 10 | quote }}
            {{- else if eq .Values.agent.shutdownMode "drain" }}
              {{- if lt (.Values.terminationGracePeriodSeconds | int) 120 }}
              {{- fail "terminationGracePeriodSeconds must be at least 120 seconds when agent.shutdownMode=drain" }}
              {{- end }}
            - name: SCALR_AGENT_WORKER_ON_STOP_ACTION
              value: drain
            - name: SCALR_AGENT_WORKER_DRAIN_TIMEOUT
              value: {{ sub .Values.terminationGracePeriodSeconds 70 | quote }}
            - name: SCALR_AGENT_WORKER_GRACE_SHUTDOWN_TIMEOUT
              value: "60"
            {{- else }}
            - name: SCALR_AGENT_WORKER_ON_STOP_ACTION
              value: force-shutdown
            {{- end }}
            - name: SCALR_AGENT_DATA_DIR
              value: {{ .Values.agent.dataDir | quote }}
            - name: SCALR_AGENT_CACHE_DIR
              value: {{ .Values.agent.cacheDir | quote }}
            {{- if .Values.agent.providerNetworkMirrors }}
            - name: SCALR_AGENT_PROVIDER_NETWORK_MIRRORS
              value: {{ toJson .Values.agent.providerNetworkMirrors | quote }}
            {{- end }}
            - name: SCALR_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  {{- if .Values.agent.tokenExistingSecret.name }}
                  name: {{ .Values.agent.tokenExistingSecret.name | quote }}
                  key: {{ .Values.agent.tokenExistingSecret.key | quote }}
                  {{- else }}
                  name: {{ include "agent-local.fullname" . }}-token
                  key: token
                  {{- end }}
                  optional: false
            {{- if $clientCert }}
            - name: SCALR_AGENT_TLS_CERT_FILE
              value: "/etc/scalr-agent/ssl/tls.crt"
            - name: SCALR_AGENT_TLS_KEY_FILE
              value: "/etc/scalr-agent/ssl/tls.key"
            {{- end }}
            {{- if $caBundle }}
            - name: SCALR_AGENT_CA_CERT
              value: "/etc/ssl/certs/scalr-ca-bundle.crt"
            - name: SSL_CERT_FILE
              value: "/etc/ssl/certs/scalr-ca-bundle.crt"
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data-dir
              mountPath: {{ .Values.agent.dataDir }}
              {{- if and (ne $data.mode "emptyDir") $data.subPath }}
              subPath: {{ $data.subPath }}
              {{- end }}
            - name: cache-dir
              mountPath: {{ .Values.agent.cacheDir }}
              {{- if and (ne $cache.mode "emptyDir") $cache.subPath }}
              subPath: {{ $cache.subPath }}
              {{- end }}
            {{- if $clientCert }}
            - name: client-cert
              mountPath: /etc/scalr-agent/ssl
              readOnly: true
            {{- end }}
            {{- if $caBundle }}
            - name: ca-bundle
              mountPath: /etc/ssl/certs/scalr-ca-bundle.crt
              subPath: {{ .Values.agent.tls.caBundleSecret.key }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- if or (ne $data.mode "volumeClaimTemplate") (ne $cache.mode "volumeClaimTemplate") $clientCert $caBundle .Values.extraVolumes }}
      volumes:
        {{- range $volume := list $data $cache }}
        {{- if ne $volume.mode "volumeClaimTemplate" }}
        {{- include "agent-local.persistence.podVolume" $volume | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- if $clientCert }}
        - name: client-cert
          secret:
            secretName: {{ .Values.agent.tls.clientCertSecret.name | default (printf "%s-client-cert" (include "agent-local.fullname" .)) }}
            items:
              - key: {{ .Values.agent.tls.clientCertSecret.certKey }}
                path: tls.crt
              - key: {{ .Values.agent.tls.clientCertSecret.keyKey }}
                path: tls.key
        {{- end }}
        {{- if $caBundle }}
        - name: ca-bundle
          secret:
            secretName: {{ .Values.agent.tls.caBundleSecret.name | default (printf "%s-ca-bundle" (include "agent-local.fullname" .)) }}
            items:
              - key: {{ .Values.agent.tls.caBundleSecret.key }}
                path: {{ .Values.agent.tls.caBundleSecret.key }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
