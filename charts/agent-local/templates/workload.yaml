{{- /* Older releases using --reuse-values need the Deployment default. */ -}}
{{- $kind := (.Values.workload).kind | default "Deployment" -}}

{{- /* Build list of all helm controller env var names */ -}}
{{- $reservedEnvVars := list
  "SCALR_AGENT_NAME"
  "SCALR_URL"
  "SCALR_AGENT_DRIVER"
  "SCALR_AGENT_CONCURRENCY"
  "SCALR_AGENT_DISCONNECT_ON_STOP"
  "SCALR_AGENT_WORKER_ON_STOP_ACTION"
  "SCALR_AGENT_WORKER_GRACE_SHUTDOWN_TIMEOUT"
  "SCALR_AGENT_WORKER_DRAIN_TIMEOUT"
  "SCALR_AGENT_DATA_DIR"
  "SCALR_AGENT_CACHE_DIR"
  "SCALR_AGENT_PROVIDER_NETWORK_MIRRORS"
  "SCALR_AGENT_TOKEN"
  "SCALR_AGENT_TLS_CERT_FILE"
  "SCALR_AGENT_TLS_KEY_FILE"
  "SCALR_AGENT_CA_CERT"
  "SSL_CERT_FILE"
  "KUBERNETES_WORKLOAD_KIND"
  "KUBERNETES_POD_NAME"
  "KUBERNETES_POD_UID"
-}}

apiVersion: apps/v1
kind: {{ $kind }}
metadata:
  {{- if eq $kind "StatefulSet" }}
  name: {{ include "agent-local.statefulSetName" . }}
  {{- else }}
  name: {{ include "agent-local.fullname" . }}
  {{- end }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "agent-local.labels" . | nindent 4 }}
  annotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    karpenter.sh/do-not-evict: "true"
    karpenter.sh/do-not-disrupt: "true"
    autopilot.gke.io/priority: high
spec:
  {{- if eq $kind "Deployment" }}
  strategy:
    type: {{ .Values.strategy.type }}
    {{- if eq .Values.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.strategy.rollingUpdate.maxUnavailable }}
    {{- end }}
  {{- else }}
  serviceName: {{ include "agent-local.statefulSetName" . }}
  podManagementPolicy: {{ (.Values.workload.statefulSet).podManagementPolicy | default "Parallel" }}
  updateStrategy:
    type: {{ dig "updateStrategy" "type" "RollingUpdate" (default dict .Values.workload.statefulSet) }}
    {{- if eq (dig "updateStrategy" "type" "RollingUpdate" (default dict .Values.workload.statefulSet)) "RollingUpdate" }}
    rollingUpdate:
      partition: {{ dig "updateStrategy" "rollingUpdate" "partition" 0 (default dict .Values.workload.statefulSet) }}
    {{- end }}
  {{- if or
    (and .Values.persistence.data.enabled (eq (.Values.persistence.data.mode | default "volumeClaimTemplate") "volumeClaimTemplate"))
    (and .Values.persistence.cache.enabled (eq (.Values.persistence.cache.mode | default "volumeClaimTemplate") "volumeClaimTemplate"))
  }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ dig "persistentVolumeClaimRetentionPolicy" "whenDeleted" "Retain" (default dict .Values.workload.statefulSet) }}
    whenScaled: {{ dig "persistentVolumeClaimRetentionPolicy" "whenScaled" "Retain" (default dict .Values.workload.statefulSet) }}
  volumeClaimTemplates:
    {{- if and .Values.persistence.data.enabled (eq (.Values.persistence.data.mode | default "volumeClaimTemplate") "volumeClaimTemplate") }}
    - metadata:
        name: data-dir
        labels:
          {{- /* Immutable claim template metadata uses stable labels across releases. */}}
          {{- include "agent-local.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: data
        {{- with omit (default dict .Values.persistence.data.persistentVolumeClaim.annotations) "helm.sh/resource-policy" }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          - {{ .Values.persistence.data.persistentVolumeClaim.accessMode }}
        resources:
          requests:
            storage: {{ .Values.persistence.data.persistentVolumeClaim.storage }}
        {{- with .Values.persistence.data.persistentVolumeClaim.storageClassName }}
        storageClassName: {{ ternary "" . (eq . "-") | quote }}
        {{- end }}
    {{- end }}
    {{- if and .Values.persistence.cache.enabled (eq (.Values.persistence.cache.mode | default "volumeClaimTemplate") "volumeClaimTemplate") }}
    - metadata:
        name: cache-dir
        labels:
          {{- include "agent-local.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: cache
        {{- with omit (default dict (.Values.persistence.cache.persistentVolumeClaim).annotations) "helm.sh/resource-policy" }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          - {{ .Values.persistence.cache.persistentVolumeClaim.accessMode }}
        resources:
          requests:
            storage: {{ .Values.persistence.cache.persistentVolumeClaim.storage }}
        {{- with .Values.persistence.cache.persistentVolumeClaim.storageClassName }}
        storageClassName: {{ ternary "" . (eq . "-") | quote }}
        {{- end }}
    {{- end }}
  {{- end }}
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "agent-local.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- merge (include "agent-local.selectorLabels" . | fromYaml) (default (dict) .Values.podLabels) | toYaml | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "agent-local.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- if .Values.extraEnv }}
            {{- range $key, $value := .Values.extraEnv }}
            {{- if has $key $reservedEnvVars }}
            {{- fail (printf "extraEnv contains a key '%s' that is controlled by the Helm chart.\n\nReserved keys are:\n  - %s" $key (join "\n  - " $reservedEnvVars)) }}
            {{- end }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- /* Empty overrides an image default, the agent derives the name from the pod. */}}
            - name: SCALR_AGENT_NAME
              value: ""
            - name: KUBERNETES_WORKLOAD_KIND
              value: {{ $kind }}
            - name: KUBERNETES_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KUBERNETES_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: SCALR_URL
              value: {{ .Values.agent.url | quote }}
            - name: SCALR_AGENT_DRIVER
              value: local
            - name: SCALR_AGENT_CONCURRENCY
              value: "1"
            - name: SCALR_AGENT_DISCONNECT_ON_STOP
              value: "1"
            {{- if eq .Values.agent.shutdownMode "graceful" }}
              {{- if lt (.Values.terminationGracePeriodSeconds | int) 30 }}
              {{- fail "terminationGracePeriodSeconds must be at least 30 seconds when agent.shutdownMode=graceful" }}
              {{- end }}
            - name: SCALR_AGENT_WORKER_ON_STOP_ACTION
              value: grace-shutdown
            - name: SCALR_AGENT_WORKER_GRACE_SHUTDOWN_TIMEOUT
              value: {{ sub .Values.terminationGracePeriodSeconds 10 | quote }}
            {{- else if eq .Values.agent.shutdownMode "drain" }}
              {{- if lt (.Values.terminationGracePeriodSeconds | int) 120 }}
              {{- fail "terminationGracePeriodSeconds must be at least 120 seconds when agent.shutdownMode=drain" }}
              {{- end }}
            - name: SCALR_AGENT_WORKER_ON_STOP_ACTION
              value: drain
            - name: SCALR_AGENT_WORKER_DRAIN_TIMEOUT
              value: {{ sub .Values.terminationGracePeriodSeconds 70 | quote }}
            - name: SCALR_AGENT_WORKER_GRACE_SHUTDOWN_TIMEOUT
              value: "60"
            {{- else }}
            - name: SCALR_AGENT_WORKER_ON_STOP_ACTION
              value: force-shutdown
            {{- end }}
            - name: SCALR_AGENT_DATA_DIR
              value: {{ .Values.agent.dataDir | quote }}
            - name: SCALR_AGENT_CACHE_DIR
              value: {{ .Values.agent.cacheDir | quote }}
            {{- if .Values.agent.providerNetworkMirrors }}
            - name: SCALR_AGENT_PROVIDER_NETWORK_MIRRORS
              value: {{ toJson .Values.agent.providerNetworkMirrors | quote }}
            {{- end }}
            - name: SCALR_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  {{- if .Values.agent.tokenExistingSecret.name }}
                  name: {{ .Values.agent.tokenExistingSecret.name | quote }}
                  key: {{ .Values.agent.tokenExistingSecret.key | quote }}
                  {{- else }}
                  name: {{ include "agent-local.fullname" . }}-token
                  key: token
                  {{- end }}
                  optional: false
            {{- if or .Values.agent.tls.clientCertSecret.name (and .Values.agent.tls.clientCert .Values.agent.tls.clientKey) }}
            - name: SCALR_AGENT_TLS_CERT_FILE
              value: "/etc/scalr-agent/ssl/tls.crt"
            - name: SCALR_AGENT_TLS_KEY_FILE
              value: "/etc/scalr-agent/ssl/tls.key"
            {{- end }}
            {{- if or .Values.agent.tls.caBundleSecret.name .Values.agent.tls.caBundle }}
            - name: SCALR_AGENT_CA_CERT
              value: "/etc/ssl/certs/scalr-ca-bundle.crt"
            - name: SSL_CERT_FILE
              value: "/etc/ssl/certs/scalr-ca-bundle.crt"
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data-dir
              mountPath: {{ .Values.agent.dataDir }}
              {{- if and
                .Values.persistence.data.enabled
                .Values.persistence.data.persistentVolumeClaim.subPath
              }}
              subPath: {{ .Values.persistence.data.persistentVolumeClaim.subPath }}
              {{- end }}
            - name: cache-dir
              mountPath: {{ .Values.agent.cacheDir }}
              {{- if and
                .Values.persistence.cache.enabled
                (.Values.persistence.cache.persistentVolumeClaim).subPath
              }}
              subPath: {{ .Values.persistence.cache.persistentVolumeClaim.subPath }}
              {{- end }}
            {{- if or .Values.agent.tls.clientCertSecret.name (and .Values.agent.tls.clientCert .Values.agent.tls.clientKey) }}
            - name: client-cert
              mountPath: /etc/scalr-agent/ssl
              readOnly: true
            {{- end }}
            {{- if or .Values.agent.tls.caBundleSecret.name .Values.agent.tls.caBundle }}
            - name: ca-bundle
              mountPath: /etc/ssl/certs/scalr-ca-bundle.crt
              subPath: {{ .Values.agent.tls.caBundleSecret.key }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- if or
        (not (and .Values.persistence.data.enabled (eq $kind "StatefulSet") (eq (.Values.persistence.data.mode | default "volumeClaimTemplate") "volumeClaimTemplate")))
        (not (and .Values.persistence.cache.enabled (eq $kind "StatefulSet") (eq (.Values.persistence.cache.mode | default "volumeClaimTemplate") "volumeClaimTemplate")))
        .Values.agent.tls.clientCertSecret.name (and .Values.agent.tls.clientCert .Values.agent.tls.clientKey)
        .Values.agent.tls.caBundleSecret.name .Values.agent.tls.caBundle
        .Values.extraVolumes
      }}
      volumes:
        {{- if not (and .Values.persistence.data.enabled (eq $kind "StatefulSet") (eq (.Values.persistence.data.mode | default "volumeClaimTemplate") "volumeClaimTemplate")) }}
        - name: data-dir
          {{- if and
            .Values.persistence.data.enabled
            (eq (.Values.persistence.data.mode | default "persistentVolumeClaim") "persistentVolumeClaim")
          }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.data.persistentVolumeClaim.claimName | default (printf "%s-data" (include "agent-local.fullname" .)) }}
          {{- else if and .Values.persistence.data.enabled (eq .Values.persistence.data.mode "ephemeral") }}
          ephemeral:
            volumeClaimTemplate:
              {{- with omit (default dict .Values.persistence.data.persistentVolumeClaim.annotations) "helm.sh/resource-policy" }}
              metadata:
                annotations:
                  {{- toYaml . | nindent 18 }}
              {{- end }}
              spec:
                accessModes:
                  - {{ .Values.persistence.data.persistentVolumeClaim.accessMode }}
                resources:
                  requests:
                    storage: {{ .Values.persistence.data.persistentVolumeClaim.storage }}
                {{- with .Values.persistence.data.persistentVolumeClaim.storageClassName }}
                storageClassName: {{ ternary "" . (eq . "-") | quote }}
                {{- end }}
          {{- else }}
          {{- with (.Values.persistence.data.emptyDir).sizeLimit }}
          emptyDir:
            sizeLimit: {{ . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
          {{- end }}
        {{- end }}
        {{- if not (and .Values.persistence.cache.enabled (eq $kind "StatefulSet") (eq (.Values.persistence.cache.mode | default "volumeClaimTemplate") "volumeClaimTemplate")) }}
        - name: cache-dir
          {{- if and
            .Values.persistence.cache.enabled
            (eq (.Values.persistence.cache.mode | default "persistentVolumeClaim") "persistentVolumeClaim")
          }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.cache.persistentVolumeClaim.claimName | default (printf "%s-cache" (include "agent-local.fullname" .)) }}
          {{- else if and .Values.persistence.cache.enabled (eq .Values.persistence.cache.mode "ephemeral") }}
          ephemeral:
            volumeClaimTemplate:
              {{- with omit (default dict (.Values.persistence.cache.persistentVolumeClaim).annotations) "helm.sh/resource-policy" }}
              metadata:
                annotations:
                  {{- toYaml . | nindent 18 }}
              {{- end }}
              spec:
                accessModes:
                  - {{ .Values.persistence.cache.persistentVolumeClaim.accessMode }}
                resources:
                  requests:
                    storage: {{ .Values.persistence.cache.persistentVolumeClaim.storage }}
                {{- with .Values.persistence.cache.persistentVolumeClaim.storageClassName }}
                storageClassName: {{ ternary "" . (eq . "-") | quote }}
                {{- end }}
          {{- else }}
          {{- with (.Values.persistence.cache.emptyDir).sizeLimit }}
          emptyDir:
            sizeLimit: {{ . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
          {{- end }}
        {{- end }}
        {{- if or .Values.agent.tls.clientCertSecret.name (and .Values.agent.tls.clientCert .Values.agent.tls.clientKey) }}
        - name: client-cert
          secret:
            secretName: {{ .Values.agent.tls.clientCertSecret.name | default (printf "%s-client-cert" (include "agent-local.fullname" .)) }}
            items:
              - key: {{ .Values.agent.tls.clientCertSecret.certKey }}
                path: tls.crt
              - key: {{ .Values.agent.tls.clientCertSecret.keyKey }}
                path: tls.key
        {{- end }}
        {{- if or .Values.agent.tls.caBundleSecret.name .Values.agent.tls.caBundle }}
        - name: ca-bundle
          secret:
            secretName: {{ .Values.agent.tls.caBundleSecret.name | default (printf "%s-ca-bundle" (include "agent-local.fullname" .)) }}
            items:
              - key: {{ .Values.agent.tls.caBundleSecret.key }}
                path: {{ .Values.agent.tls.caBundleSecret.key }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
