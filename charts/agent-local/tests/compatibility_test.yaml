suite: Existing release compatibility
templates:
  - workload.yaml
  - pvc.yaml
release:
  name: storage-test
  upgrade: true
set:
  agent.token: dummy
tests:
  - it: reuses old defaults with unused legacy cache settings
    set:
      workload: null
      persistence.data.mode: null
      persistence.cache.mode: null
      persistence.data.persistentVolumeClaim.annotations: null
      persistence.cache.persistentVolumeClaim.annotations: null
      persistence.enabled: false
      persistence.persistentVolumeClaim:
        claimName: ""
        storageClassName: ""
        storage: 20Gi
        accessMode: ReadWriteOnce
        subPath: ""
    asserts: &default_workload
      - isKind:
          of: Deployment
        template: workload.yaml
      - equal:
          path: metadata.name
          value: storage-test-agent-local
        template: workload.yaml
      - notExists:
          path: spec.template.metadata.annotations
        template: workload.yaml
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: data-dir
              emptyDir:
                sizeLimit: 4Gi
            - name: cache-dir
              emptyDir:
                sizeLimit: 20Gi
        template: workload.yaml
      - hasDocuments:
          count: 0
        template: pvc.yaml

  - it: ignores an explicitly disabled legacy persistence flag
    set:
      persistence.enabled: false
    asserts: *default_workload

  - it: supplies StatefulSet defaults when reused values only set the kind
    template: workload.yaml
    set:
      workload.kind: StatefulSet
      workload.statefulSet: null
      persistence.cache.enabled: true
      persistence.cache.mode: volumeClaimTemplate
    asserts:
      - isSubset:
          path: spec
          content:
            podManagementPolicy: Parallel
            updateStrategy:
              type: RollingUpdate
              rollingUpdate:
                partition: 0
            persistentVolumeClaimRetentionPolicy:
              whenDeleted: Retain
              whenScaled: Retain

  - it: preserves unlimited emptyDir volumes set to null
    set:
      persistence.data.emptyDir.sizeLimit: null
      persistence.cache.emptyDir.sizeLimit: null
    template: workload.yaml
    asserts: &unlimited
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: data-dir
              emptyDir: {}
            - name: cache-dir
              emptyDir: {}

  - it: preserves unlimited emptyDir volumes set to an empty string
    set:
      persistence.data.emptyDir.sizeLimit: ""
      persistence.cache.emptyDir.sizeLimit: ""
    template: workload.yaml
    asserts: *unlimited

  - it: treats null persistence flags as disabled
    set:
      persistence.data.enabled: null
      persistence.cache.enabled: null
    template: workload.yaml
    asserts: &disabled_volumes
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: data-dir
              emptyDir:
                sizeLimit: 4Gi
            - name: cache-dir
              emptyDir:
                sizeLimit: 20Gi

  - it: mounts existing claims without requiring provisioning settings
    set: &existing_claims
      persistence.data.enabled: true
      persistence.data.persistentVolumeClaim:
        claimName: data-existing
        storage: null
        accessMode: null
      persistence.cache.enabled: true
      persistence.cache.persistentVolumeClaim:
        claimName: cache-existing
        storage: null
        accessMode: null
    asserts: &existing_mounts
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: data-dir
              persistentVolumeClaim:
                claimName: data-existing
            - name: cache-dir
              persistentVolumeClaim:
                claimName: cache-existing
        template: workload.yaml
      - hasDocuments:
          count: 0
        template: pvc.yaml

  - it: also mounts existing claims on StatefulSets
    set:
      <<: *existing_claims
      workload.kind: StatefulSet
    asserts: *existing_mounts

  - it: ignores provisioning access modes when mounting existing claims
    set:
      <<: *existing_claims
      replicaCount: 2
      persistence.data.persistentVolumeClaim.accessMode: ReadWriteOncePod
      persistence.cache.persistentVolumeClaim.accessMode: ReadWriteOncePod
    asserts: *existing_mounts

  - it: keeps explicit storage modes disabled when enabled flags are null
    set:
      <<: *existing_claims
      persistence.data.enabled: null
      persistence.cache.enabled: null
      persistence.data.mode: persistentVolumeClaim
      persistence.cache.mode: persistentVolumeClaim
    template: workload.yaml
    asserts: *disabled_volumes

  - it: preserves truthy string persistence flags
    set:
      <<: *existing_claims
      persistence.data.enabled: "true"
      persistence.cache.enabled: "true"
    asserts: *existing_mounts

  - it: mounts claims when unused emptyDir settings are null
    set:
      <<: *existing_claims
      persistence.data.emptyDir: null
      persistence.cache.emptyDir: null
    asserts: *existing_mounts

  - it: uses current cache settings despite unused legacy PVC options
    set:
      persistence.enabled: false
      persistence.persistentVolumeClaim.storage: 7Gi
      persistence.cache.mode: null
      persistence.cache.enabled: true
      persistence.cache.persistentVolumeClaim.storage: 99Gi
    asserts:
      - equal:
          path: spec.template.spec.volumes[?(@.name == "cache-dir")].persistentVolumeClaim.claimName
          value: storage-test-agent-local-cache
        template: workload.yaml
      - equal:
          path: metadata.name
          value: storage-test-agent-local-cache
        template: pvc.yaml
      - equal:
          path: spec.resources.requests.storage
          value: 99Gi
        template: pvc.yaml

  - it: accepts string replicas and numeric storage quantities
    set:
      replicaCount: "2"
      persistence.cache.enabled: true
      persistence.cache.persistentVolumeClaim.storage: 4294967296
    asserts:
      - equal:
          path: spec.replicas
          value: 2
        template: workload.yaml
      - equal:
          path: spec.resources.requests.storage
          value: 4294967296.0
        template: pvc.yaml
