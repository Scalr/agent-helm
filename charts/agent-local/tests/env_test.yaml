suite: Conditional environment variables
templates:
  - workload.yaml
release:
  name: storage-test
set:
  agent.token: dummy
tests:
  - it: preserves the existing environment variable order on upgrade
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: SCALR_AGENT_NAME
              value: ''
            - name: KUBERNETES_WORKLOAD_KIND
              value: Deployment
            - name: KUBERNETES_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KUBERNETES_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: SCALR_URL
              value: ''
            - name: SCALR_AGENT_DRIVER
              value: local
            - name: SCALR_AGENT_CONCURRENCY
              value: '1'
            - name: SCALR_AGENT_DISCONNECT_ON_STOP
              value: '1'
            - name: SCALR_AGENT_WORKER_ON_STOP_ACTION
              value: grace-shutdown
            - name: SCALR_AGENT_WORKER_GRACE_SHUTDOWN_TIMEOUT
              value: '110'
            - name: SCALR_AGENT_DATA_DIR
              value: /var/lib/scalr-agent/data
            - name: SCALR_AGENT_CACHE_DIR
              value: /var/lib/scalr-agent/cache
            - name: SCALR_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: storage-test-agent-local-token
                  key: token
                  optional: false

  - it: preserves environment order with extra variables and conditional chart settings
    set:
      extraEnv.EXAMPLE: custom
      agent.shutdownMode: drain
      agent.tls.clientCertSecret.name: client-cert
      agent.tls.caBundleSecret.name: ca-bundle
      agent.providerNetworkMirrors:
        - url: https://mirror.example.com
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: EXAMPLE
              value: custom
            - name: SCALR_AGENT_NAME
              value: ''
            - name: KUBERNETES_WORKLOAD_KIND
              value: Deployment
            - name: KUBERNETES_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KUBERNETES_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: SCALR_URL
              value: ''
            - name: SCALR_AGENT_DRIVER
              value: local
            - name: SCALR_AGENT_CONCURRENCY
              value: '1'
            - name: SCALR_AGENT_DISCONNECT_ON_STOP
              value: '1'
            - name: SCALR_AGENT_WORKER_ON_STOP_ACTION
              value: drain
            - name: SCALR_AGENT_WORKER_DRAIN_TIMEOUT
              value: '50'
            - name: SCALR_AGENT_WORKER_GRACE_SHUTDOWN_TIMEOUT
              value: '60'
            - name: SCALR_AGENT_DATA_DIR
              value: /var/lib/scalr-agent/data
            - name: SCALR_AGENT_CACHE_DIR
              value: /var/lib/scalr-agent/cache
            - name: SCALR_AGENT_PROVIDER_NETWORK_MIRRORS
              value: '[{"url":"https://mirror.example.com"}]'
            - name: SCALR_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: storage-test-agent-local-token
                  key: token
                  optional: false
            - name: SCALR_AGENT_TLS_CERT_FILE
              value: /etc/scalr-agent/ssl/tls.crt
            - name: SCALR_AGENT_TLS_KEY_FILE
              value: /etc/scalr-agent/ssl/tls.key
            - name: SCALR_AGENT_CA_CERT
              value: /etc/ssl/certs/scalr-ca-bundle.crt
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/scalr-ca-bundle.crt

  - it: passes the StatefulSet identity to the agent
    set:
      workload.kind: StatefulSet
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KUBERNETES_WORKLOAD_KIND
            value: StatefulSet
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KUBERNETES_POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KUBERNETES_POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid

  - it: reserves the pod name supplied by the Downward API
    set:
      extraEnv.KUBERNETES_POD_NAME: custom
    asserts:
      - failedTemplate:
          errorPattern: KUBERNETES_POD_NAME

  - it: rejects a cache directory override through extraEnv
    set:
      extraEnv.SCALR_AGENT_CACHE_DIR: /custom/cache
    asserts:
      - failedTemplate:
          errorPattern: SCALR_AGENT_CACHE_DIR

  - it: reserves the TLS certificate path even when TLS is disabled
    set:
      extraEnv.SCALR_AGENT_TLS_CERT_FILE: /custom/tls.crt
    asserts:
      - failedTemplate:
          errorPattern: SCALR_AGENT_TLS_CERT_FILE

  - it: reserves the TLS key path even when TLS is disabled
    set:
      extraEnv.SCALR_AGENT_TLS_KEY_FILE: /custom/tls.key
    asserts:
      - failedTemplate:
          errorPattern: SCALR_AGENT_TLS_KEY_FILE

  - it: reserves the drain timeout even when the chart uses graceful shutdown
    set:
      extraEnv.SCALR_AGENT_WORKER_DRAIN_TIMEOUT: "90"
    asserts:
      - failedTemplate:
          errorPattern: SCALR_AGENT_WORKER_DRAIN_TIMEOUT

  - it: keeps SSL_CERT_FILE reserved when no CA bundle is configured
    set:
      extraEnv.SSL_CERT_FILE: /custom/ca.crt
    asserts:
      - failedTemplate:
          errorPattern: "SSL_CERT_FILE"

  - it: keeps reserved variables listed when their chart settings are disabled
    set:
      agent.shutdownMode: force
      extraEnv:
        SCALR_AGENT_CA_CERT: /custom/ca.crt
        SSL_CERT_FILE: /custom/ca.crt
        SCALR_AGENT_PROVIDER_NETWORK_MIRRORS: '[{"url":"https://mirror.example.com"}]'
        SCALR_AGENT_WORKER_GRACE_SHUTDOWN_TIMEOUT: "90"
    asserts:
      - failedTemplate:
          errorPattern: |-
            ^\s*Reserved keys are:
              - SCALR_AGENT_NAME
              - SCALR_URL
              - SCALR_AGENT_DRIVER
              - SCALR_AGENT_CONCURRENCY
              - SCALR_AGENT_DISCONNECT_ON_STOP
              - SCALR_AGENT_WORKER_ON_STOP_ACTION
              - SCALR_AGENT_WORKER_GRACE_SHUTDOWN_TIMEOUT
              - SCALR_AGENT_WORKER_DRAIN_TIMEOUT
              - SCALR_AGENT_DATA_DIR
              - SCALR_AGENT_CACHE_DIR
              - SCALR_AGENT_PROVIDER_NETWORK_MIRRORS
              - SCALR_AGENT_TOKEN
              - SCALR_AGENT_TLS_CERT_FILE
              - SCALR_AGENT_TLS_KEY_FILE
              - SCALR_AGENT_CA_CERT
              - SSL_CERT_FILE
              - KUBERNETES_WORKLOAD_KIND
              - KUBERNETES_POD_NAME
              - KUBERNETES_POD_UID\s*$
