suite: Storage mode combinations
templates:
  - workload.yaml
  - pvc.yaml
release:
  name: storage-test
set:
  agent.token: dummy
  agent.dataDir: /custom/data
  agent.cacheDir: /custom/cache
  replicaCount: 3
tests:
  - it: renders Deployment with emptyDir data and emptyDir cache
    template: workload.yaml
    set:
      workload.kind: Deployment
      persistence.data.mode: emptyDir
      persistence.cache.mode: emptyDir
    asserts:
      - &data_mount
        equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "data-dir")]
          value:
            name: data-dir
            mountPath: /custom/data
      - &cache_mount
        equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "cache-dir")]
          value:
            name: cache-dir
            mountPath: /custom/cache
      - &Deployment
        isKind:
          of: Deployment
      - &data_emptyDir
        equal:
          path: spec.template.spec.volumes[?(@.name == "data-dir")]
          value:
            name: data-dir
            emptyDir:
              sizeLimit: 4Gi
      - &cache_emptyDir
        equal:
          path: spec.template.spec.volumes[?(@.name == "cache-dir")]
          value:
            name: cache-dir
            emptyDir:
              sizeLimit: 20Gi
      - &pod_volumes_2
        lengthEqual:
          path: spec.template.spec.volumes
          count: 2
      - &claim_templates_0
        notExists:
          path: spec.volumeClaimTemplates
      - &shared_claims_0
        hasDocuments:
          count: 0
        template: pvc.yaml

  - it: renders Deployment with emptyDir data and persistentVolumeClaim cache
    template: workload.yaml
    set:
      workload.kind: Deployment
      persistence.data.mode: emptyDir
      persistence.cache.mode: persistentVolumeClaim
    asserts:
      - *data_mount
      - *cache_mount
      - *Deployment
      - *data_emptyDir
      - &cache_persistentVolumeClaim
        equal:
          path: spec.template.spec.volumes[?(@.name == "cache-dir")]
          value:
            name: cache-dir
            persistentVolumeClaim:
              claimName: storage-test-agent-local-cache
      - &cache_claim
        equal:
          path: spec
          value:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 20Gi
        template: pvc.yaml
        documentSelector:
          path: metadata.name
          value: storage-test-agent-local-cache
      - *pod_volumes_2
      - *claim_templates_0
      - &shared_claims_1
        hasDocuments:
          count: 1
        template: pvc.yaml

  - it: renders Deployment with emptyDir data and ephemeral cache
    template: workload.yaml
    set:
      workload.kind: Deployment
      persistence.data.mode: emptyDir
      persistence.cache.mode: ephemeral
      persistence.cache.persistentVolumeClaim.accessMode: ReadWriteOncePod
    asserts:
      - *data_mount
      - *cache_mount
      - *Deployment
      - *data_emptyDir
      - &cache_ephemeral
        equal:
          path: spec.template.spec.volumes[?(@.name == "cache-dir")]
          value:
            name: cache-dir
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes: [ReadWriteOncePod]
                  resources:
                    requests:
                      storage: 20Gi
      - *pod_volumes_2
      - *claim_templates_0
      - *shared_claims_0

