suite: Workload and storage validation
templates:
  - workload.yaml
set:
  agent.token: dummy
tests:
  - it: rejects unsupported workload kinds
    set:
      workload.kind: DaemonSet
    asserts: &invalid_kind
      - failedTemplate:
          errorPattern: workload.kind

  - it: rejects incorrect workload capitalization
    set:
      workload.kind: statefulset
    asserts: *invalid_kind

  - it: rejects non-string workload kinds
    set:
      workload.kind: 1
    asserts: *invalid_kind

  - it: rejects an explicitly empty workload kind
    set:
      workload.kind: ""
    asserts: *invalid_kind

  - it: rejects an unknown data storage mode
    set:
      persistence.data.mode: invalid
    asserts: &invalid_data_mode
      - failedTemplate:
          errorPattern: persistence.data.mode

  - it: rejects an unknown cache storage mode
    set:
      persistence.cache.mode: invalid
    asserts: &invalid_cache_mode
      - failedTemplate:
          errorPattern: persistence.cache.mode

  - it: rejects data claim templates on a Deployment
    set:
      persistence.data.mode: volumeClaimTemplate
    asserts: *invalid_data_mode

  - it: rejects cache claim templates on a Deployment
    set:
      persistence.cache.mode: volumeClaimTemplate
    asserts: *invalid_cache_mode

  - it: rejects claim templates when old values omit the workload
    set:
      workload: null
      persistence.cache.mode: volumeClaimTemplate
    asserts: *invalid_cache_mode

  - it: preserves the reserved keys when rejecting a chart-controlled variable
    set:
      extraEnv.SCALR_AGENT_NAME: custom
    asserts: &reserved_keys
      - failedTemplate:
          errorPattern: |-
            ^\s*Reserved keys are:
              - SCALR_AGENT_NAME
              - SCALR_URL
              - SCALR_AGENT_DRIVER
              - SCALR_AGENT_CONCURRENCY
              - SCALR_AGENT_DISCONNECT_ON_STOP
              - SCALR_AGENT_WORKER_ON_STOP_ACTION
              - SCALR_AGENT_WORKER_GRACE_SHUTDOWN_TIMEOUT
              - SCALR_AGENT_DATA_DIR
              - SCALR_AGENT_PROVIDER_NETWORK_MIRRORS
              - SCALR_AGENT_TOKEN
              - SCALR_AGENT_CA_CERT
              - SSL_CERT_FILE\s*$

  - it: keeps the same reserved keys with drain TLS CA and mirror settings
    set:
      agent.shutdownMode: drain
      agent.tls.clientCertSecret.name: client-cert
      agent.tls.caBundleSecret.name: ca-bundle
      agent.providerNetworkMirrors:
        - url: https://mirror.example.com
      extraEnv.SCALR_AGENT_NAME: custom
    asserts: *reserved_keys
