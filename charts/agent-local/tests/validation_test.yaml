suite: Workload and storage validation
templates:
  - workload.yaml
  - pvc.yaml
set:
  agent.token: dummy
tests:
  - it: rejects the removed top-level persistence flag
    set:
      persistence.enabled: true
    asserts: &removed_persistence
      - failedTemplate:
          errorPattern: |-
            Move the old settings under persistence.cache and remove the old keys. For example:

            persistence:
              cache:
                enabled: true
                persistentVolumeClaim:
                  storage: 20Gi
        template: pvc.yaml

  - it: rejects a legacy claim name even when legacy persistence is disabled
    set:
      persistence.enabled: false
      persistence.persistentVolumeClaim.claimName: legacy-cache
    asserts: *removed_persistence

  - it: rejects removed settings alongside current cache settings
    set:
      workload.kind: StatefulSet
      persistence.cache.enabled: true
      persistence.cache.mode: volumeClaimTemplate
      persistence.persistentVolumeClaim.claimName: legacy-cache
    asserts: *removed_persistence

  - it: rejects unsupported workload kinds
    set:
      workload.kind: DaemonSet
    asserts: &invalid_kind
      - failedTemplate:
          errorPattern: workload.kind

  - it: rejects incorrect workload capitalization
    set:
      workload.kind: statefulset
    asserts: *invalid_kind

  - it: rejects non-string workload kinds
    set:
      workload.kind: 1
    asserts: *invalid_kind

  - it: rejects an explicitly empty workload kind
    set:
      workload.kind: ""
    asserts: *invalid_kind

  - it: rejects an unknown data storage mode
    set:
      persistence.data.mode: invalid
    asserts: &invalid_data_mode
      - failedTemplate:
          errorPattern: persistence.data

  - it: rejects an unknown cache storage mode
    set:
      persistence.cache.mode: invalid
    asserts: &invalid_cache_mode
      - failedTemplate:
          errorPattern: persistence.cache

  - it: rejects data claim templates on a Deployment
    set:
      persistence.data.enabled: true
      persistence.data.mode: volumeClaimTemplate
    asserts: *invalid_data_mode

  - it: rejects cache claim templates on a Deployment
    set:
      persistence.cache.enabled: true
      persistence.cache.mode: volumeClaimTemplate
    asserts: *invalid_cache_mode

  - it: rejects claim templates when old values omit the workload
    set:
      workload: null
      persistence.cache.enabled: true
      persistence.cache.mode: volumeClaimTemplate
    asserts: *invalid_cache_mode

  - it: rejects a shared cache RWOP claim across StatefulSet replicas
    set:
      workload.kind: StatefulSet
      replicaCount: 2
      persistence.cache.enabled: true
      persistence.cache.mode: persistentVolumeClaim
      persistence.cache.persistentVolumeClaim.accessMode: ReadWriteOncePod
    asserts: &shared_rwop_replicas
      - failedTemplate:
          errorPattern: shared ReadWriteOncePod claim requires replicaCount <= 1
        template: pvc.yaml

  - it: rejects a shared data RWOP claim across Deployment replicas even with Recreate
    set:
      replicaCount: "2"
      strategy.type: Recreate
      persistence.data.enabled: true
      persistence.data.mode: persistentVolumeClaim
      persistence.data.persistentVolumeClaim.accessMode: ReadWriteOncePod
    asserts: *shared_rwop_replicas

  - it: rejects multiple replicas when enabled selects a shared data RWOP claim
    set:
      replicaCount: 2
      persistence.data.enabled: "true"
      persistence.data.persistentVolumeClaim.accessMode: ReadWriteOncePod
    asserts: *shared_rwop_replicas

  - it: rejects multiple replicas when enabled selects a shared cache RWOP claim
    set:
      workload: null
      replicaCount: 2
      persistence.cache.enabled: true
      persistence.cache.persistentVolumeClaim.accessMode: ReadWriteOncePod
    asserts: *shared_rwop_replicas

  - it: lists all reserved keys when rejecting a chart-controlled variable
    set:
      extraEnv.SCALR_AGENT_NAME: custom
    asserts: &reserved_keys
      - failedTemplate:
          errorPattern: |-
            ^\s*Reserved keys are:
              - SCALR_AGENT_NAME
              - SCALR_URL
              - SCALR_AGENT_DRIVER
              - SCALR_AGENT_CONCURRENCY
              - SCALR_AGENT_DISCONNECT_ON_STOP
              - SCALR_AGENT_WORKER_ON_STOP_ACTION
              - SCALR_AGENT_WORKER_GRACE_SHUTDOWN_TIMEOUT
              - SCALR_AGENT_WORKER_DRAIN_TIMEOUT
              - SCALR_AGENT_DATA_DIR
              - SCALR_AGENT_CACHE_DIR
              - SCALR_AGENT_PROVIDER_NETWORK_MIRRORS
              - SCALR_AGENT_TOKEN
              - SCALR_AGENT_TLS_CERT_FILE
              - SCALR_AGENT_TLS_KEY_FILE
              - SCALR_AGENT_CA_CERT
              - SSL_CERT_FILE\s*$
        template: workload.yaml

  - it: keeps the same reserved keys with drain TLS CA and mirror settings
    set:
      agent.shutdownMode: drain
      agent.tls.clientCertSecret.name: client-cert
      agent.tls.caBundleSecret.name: ca-bundle
      agent.providerNetworkMirrors:
        - url: https://mirror.example.com
      extraEnv.SCALR_AGENT_NAME: custom
    asserts: *reserved_keys
